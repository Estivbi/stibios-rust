[workspace]
resolver = "2"
members = ["agent-replay", "stibios-init"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Carolina <carolinarb1994@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Estivbi/stibios-rust"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.28"
ratatui = "0.29"
